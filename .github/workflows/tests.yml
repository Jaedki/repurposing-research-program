name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run self-test
        run: python scripts/self_test.py

      - name: Test source-payload compaction
        run: python scripts/compact_source_payload_test.py

      - name: Test schema-v7 case model
        run: python scripts/v7_case_model_test.py

      - name: Test schema-v7 seed funnel
        run: python scripts/v7_seed_funnel_test.py

      - name: Test schema-v7 discovery semantics
        run: python scripts/v7_discovery_test.py

      - name: Test schema-v7 retrieval adapters and coverage proof
        run: python scripts/v7_retrieval_adapter_test.py

      - name: Test schema-v7 chemical and target adapters
        run: python scripts/v7_chemical_target_adapters_test.py

      - name: Test schema-v7 extended discovery adapters
        run: python scripts/v7_extended_discovery_adapters_test.py

      - name: Test schema-v7 persisted production discovery aggregate
        run: python scripts/v7_production_discovery_test.py

      - name: Test schema-v7 persisted production disposition aggregate
        run: python scripts/v7_production_disposition_test.py

      - name: Test schema-v7 persisted production screen and deep aggregate
        run: python scripts/v7_production_screen_deep_test.py

      - name: Test schema-v7 persisted production audit and portfolio aggregate
        run: python scripts/v7_production_portfolio_test.py

      - name: Test schema-v7 complete eight-stage production programme
        run: python scripts/v7_production_program_test.py

      - name: Test schema-v7 benchmark production protocols
        run: python scripts/v7_benchmark_test.py

      - name: Test schema-v7 deep evidence and authoritative identity
        run: python scripts/v7_deep_evidence_test.py

      - name: Test schema-v7 runtime DAG and role packets
        run: python scripts/v7_runtime_test.py

      - name: Test schema-v7 deterministic triage and ranking
        run: python scripts/v7_triage_ranking_test.py

      - name: Test schema-v7 audit, council, and portfolio policy
        run: python scripts/v7_audit_portfolio_test.py

      - name: Test schema-v7 full-funnel outputs and modular validation
        run: python scripts/v7_outputs_test.py

      - name: Run integration test
        run: python scripts/integration_test.py
