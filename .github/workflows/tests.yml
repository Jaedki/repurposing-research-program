name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run self-test
        run: python scripts/self_test.py

      - name: Test source-payload compaction
        run: python scripts/compact_source_payload_test.py

      - name: Run integration test
        run: python scripts/integration_test.py
